services:
  db:
    image: postgres:16
    container_name: rls-demo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Intentionally no named volume: this is a throwaway demo database, so
    # `npm run db:down` (compose down -v) leaves nothing behind. Add a volume
    # if you want the data to survive restarts.
